name: installer-check

# Pins the installer/discovery contract: skills must land in
# ~/workspace/custom-skills/ (the only folder Muse skill search scans),
# MANIFEST.json must cover every skill, and a sandbox install in every
# mode must place files the way install.sh promises.

on:
  push:
    paths:
      - "install.sh"
      - "MANIFEST.json"
      - "scripts/check-installer.sh"
      - "scripts/test-install.sh"
      - "scripts/generate-manifest.py"
      - "skills/**"
  pull_request:
    paths:
      - "install.sh"
      - "MANIFEST.json"
      - "scripts/check-installer.sh"
      - "scripts/test-install.sh"
      - "scripts/generate-manifest.py"
      - "skills/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure rsync
        run: command -v rsync || (sudo apt-get update && sudo apt-get install -y rsync)
      - name: Installer contract check
        run: bash scripts/check-installer.sh
      - name: Sandbox install test (all modes)
        run: bash scripts/test-install.sh
