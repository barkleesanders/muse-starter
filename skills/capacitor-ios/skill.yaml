name: "capacitor_ios"
title: "Capacitor Ios"
description: ">- Phased super-skill that turns a web app (improvebayarea.com or any Cloudflare Workers / SPA / PWA site) into a store-ready native iOS app with Capacitor — end to end. Use when the user wants to \"make this an iOS app\", \"wrap the site\", \"ship improvebayarea to the App Store\", add camera/geolocation/push to a web app, set up live web updates without App Store resubmission, build/run/test the app on the iOS Simulator, or asks how the web↔app update loop works. Detects the active phase and loads only that phase's reference file, the way /carmack loads only the relevant mode. Orchestrates the installed Capgo 48 capacitor-skills, awesome-ionic-mcp, XcodeBuildMCP + /xcode-test, /ios-ship (greenlight + privacy manifest), context7, sosumi, app-store-screenshots and aso-audit. Triggers: \"capacitor\", \"wrap web app\", \"make it an iOS app\", \"ship to app store\", \"live updates / OTA\", \"Capgo\"."
category: "Work and knowledge"
include_in_prompt: false
